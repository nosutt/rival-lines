<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rival Lines Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* layout idea: one game table. Scores on a top rail, the board fills the middle, your rack sits at the bottom. */
:root {
  --table: #0d3840;
  --table-deep: #082a31;
  --rail: #06222a;
  --ink: #101c22;
  --paper: #fcfdf9;
  --text: #eef7f5;
  --muted: #9fbdbb;
  --signal: #ffd23f;
  --you: #2a78f0;
  --bot: #ff6a13;
  --display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--table-deep);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, .tilebtn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; position: relative; overflow: hidden; }
#app > * { min-width: 0; }

/* ---- top rail ---- */
#top { background: var(--rail); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 3px solid #041920; }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.bot { justify-content: flex-end; text-align: right; }
.swatch { width: 14px; height: 34px; border-radius: 7px; flex: none; border: 2px solid rgba(255, 255, 255, .85); }
.you .swatch { background: var(--you); }
.bot .swatch { background: var(--bot); }
.who { min-width: 0; }
.who b { font-family: var(--display); font-weight: 600; font-size: 17px; display: block; line-height: 1.1; }
.who small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.pts { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
.side.turn .pts { color: var(--signal); }
#mid { text-align: left; }
#title { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; line-height: 1.1; }
#bag { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* ---- board ---- */
#boardWrap { position: relative; min-height: 0; background-color: var(--table); background-image: radial-gradient(rgba(255, 255, 255, .07) 1.2px, transparent 1.4px); background-size: 22px 22px; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#board .lbl { font-family: var(--display); font-weight: 700; }
#zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
#zoom button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(6, 34, 42, .88); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1; }
#zoom #zfit { font-size: 13px; }

/* ---- rack ---- */
#tray { background: var(--rail); border-top: 3px solid #041920; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
#status { min-height: 2.7em; font-size: 16px; display: flex; align-items: center; }
#status b { font-family: var(--display); font-weight: 600; }
#status .y { color: #8fb8ff; }
#status .b { color: #ffb184; }
#status .hi { color: var(--signal); }
#hand { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 7px; max-width: 800px; width: 100%; margin: 0 auto; }
.tilebtn { padding: 0; border: 0; background: none; border-radius: 10px; display: block; width: 100%; max-width: 112px; justify-self: center; position: relative; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); }
.tilebtn svg { display: block; width: 100%; height: auto; }
.tilebtn.dead { opacity: .42; }
.tilebtn.sel { filter: drop-shadow(0 0 0 var(--signal)) drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); top: -5px; outline: 3px solid var(--signal); outline-offset: 1px; }
#actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.btn { border: 0; border-radius: 12px; padding: 9px 14px; min-height: 42px; background: #134a54; color: var(--text); font-family: var(--display); font-weight: 600; font-size: 15.5px; }
.btn.primary { background: var(--signal); color: #1c1600; }
.btn:disabled { opacity: .38; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 9px 10px; font-size: 15px; color: var(--muted); min-height: 42px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--signal); }

/* ---- sheets (start, rules, result) ---- */
#overlay { position: absolute; inset: 0; background: rgba(4, 22, 27, .78); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#overlay.on { display: flex; }
.sheet { background: #f7faf6; color: var(--ink); border-radius: 20px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; padding: 22px 22px 20px; box-shadow: 0 10px 0 rgba(0, 0, 0, .3); color-scheme: light; }
.sheet h1 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 0 0 2px; line-height: 1.05; text-wrap: balance; }
.sheet h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 16px 0 6px; }
.sheet p { margin: 6px 0; max-width: 62ch; }
.sheet .sub { color: #486068; margin-bottom: 10px; }
.sheet ol { margin: 6px 0 0; padding-left: 1.3em; }
.sheet li { margin: 5px 0; max-width: 60ch; }
.sheet li b, .sheet p b { font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border-radius: 11px; background: #e8efea; color: var(--ink); }
.opt input { margin-top: 3px; width: 18px; height: 18px; accent-color: #0d3840; flex: none; }
.sheet .btn { background: #0d3840; color: #fff; }
.sheet .btn.primary { background: var(--signal); color: #1c1600; }
.sheetbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin-top: 6px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.legend svg { width: 58px; height: auto; flex: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); }
.tilegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px 12px; }
.tilegrid div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.tilegrid svg { width: 100%; max-width: 104px; height: auto; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); }
table.res { border-collapse: collapse; width: 100%; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.res th, table.res td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #d5ded8; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res tr.tot td { font-family: var(--display); font-weight: 700; font-size: 22px; border-bottom: 0; }
.cy { color: #1d5fc4; } .cb { color: #cf4f06; }

@media (max-width: 520px) {
  #top { padding: 6px 12px; gap: 6px; }
  .pts { font-size: 28px; }
  .who small { display: none; }
  #title { font-size: 16px; }
  #tray { padding: 6px 12px 8px; gap: 6px; }
  #status { font-size: 15px; }
  .btn { padding: 8px 11px; font-size: 14.5px; }
  .toggle { font-size: 14px; padding: 8px 6px; }
  .sheet { padding: 18px 16px 16px; }
  .sheet h1 { font-size: 26px; }
}

/* ---- players ---- */
#chips { display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 6px; border-radius: 12px; background: #0b3038; border: 2px solid transparent; }
.chip.turn { border-color: var(--signal); background: #124650; }
.chip .sw { width: 12px; height: 26px; border-radius: 6px; border: 2px solid rgba(255, 255, 255, .85); flex: none; }
.chip .nm { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.05; display: flex; flex-direction: column; }
.chip .nm small { font-family: var(--body); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.chip .pts { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; }
.chip.turn .pts { color: var(--signal); }
div.tilebtn { cursor: default; }
.opts.row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seats { display: grid; gap: 6px; margin-top: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 11px; background: #e8efea; }
.seat .sw { width: 14px; height: 26px; border-radius: 7px; border: 2px solid #101c22; flex: none; }
.seat label { font-family: var(--display); font-weight: 600; min-width: 4.4em; }
.seat input, .seat select { flex: 1; min-width: 0; min-height: 38px; border-radius: 9px; border: 2px solid #0d3840; background: #fff; color: #101c22; padding: 4px 8px; font: inherit; }
@media (max-width: 520px) {
  #top { grid-template-columns: minmax(0, 1fr); }
  #mid { display: flex; gap: 10px; align-items: baseline; }
  #chips { justify-content: flex-start; }
  .chip { padding: 3px 8px 3px 5px; gap: 5px; }
  .chip .nm small { display: none; }
  .chip .nm { font-size: 14px; }
  .chip .pts { font-size: 20px; }
}

.tilegrid small { font-size: 12px; color: #5a6c72; text-align: center; line-height: 1.2; }
.tilegrid .gone svg { opacity: .3; }

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="mid"><div id="title">Rival Lines</div><div id="bag"></div></div>
    <div id="chips"></div>
  </header>
  <main id="boardWrap">
    <svg id="board" role="img" aria-label="Game board"><g id="view"><g id="shadows" fill="rgba(0,0,0,.3)"></g><g id="tiles"></g><g id="trains"></g><g id="marks"></g><g id="fx"></g></g></svg>
    <div id="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button><button type="button" id="zfit">Fit</button></div>
  </main>
  <footer id="tray">
    <div id="status" aria-live="polite"></div>
    <div id="hand"></div>
    <div id="actions">
      <button type="button" class="btn" id="rotate">Rotate</button>
      <button type="button" class="btn primary" id="place">Place</button>
      <button type="button" class="btn" id="pass">Pass</button>
      <button type="button" class="btn" id="swap">Trade in hand</button>
      <button type="button" class="btn" id="rulesBtn">Rules</button>
      <button type="button" class="btn" id="restart">Restart</button>
      <label class="toggle" for="anim"><input type="checkbox" id="anim" checked> Animation</label>
      <label class="toggle" for="snd"><input type="checkbox" id="snd" checked> Sound</label>
    </div>
  </footer>
  <div id="overlay"></div>
</div>
<script>
/* Rival Lines — rules engine (no DOM). Playtest rules v0.2 */
(function (root) {
  'use strict';
  var DX = [-1, 0, 1, 0], DY = [0, -1, 0, 1]; // edge order: L, T, R, B
  function opp(d) { return (d + 2) & 3; }
  function key(x, y) { return x + ',' + y; }

  var DEFS = {};
  function D(id, kind, shape, edges, count) { DEFS[id] = { id: id, kind: kind, shape: shape, edges: edges, count: count }; }
  // edges: 't' track opening, 'p' platform, '.' blank, 'x' wild (Penn)
  D('track_hook', 'track', 'hook', 't..t', 10);
  D('track_corner', 'track', 'corner', '..tt', 10);
  D('track_straight', 'track', 'straight', '.t.t', 5);
  D('track_wave', 'track', 'wave', 't.t.', 4);
  D('track_tside', 'track', 'tside', 'tt.t', 3);
  D('track_tthru', 'track', 'tthru', 't.tt', 2);
  D('bridge_hook', 'bridge', 'hook', 't..t', 3);
  D('bridge_corner', 'bridge', 'corner', '..tt', 3);
  D('bridge_straight', 'bridge', 'straight', '.t.t', 3);
  D('bridge_wave', 'bridge', 'wave', 't.t.', 2);
  D('bridge_tside', 'bridge', 'tside', 'tt.t', 5);
  D('cross', 'cross', 'cross', 'tttt', 4);
  D('combo_straight', 'combo', 'straight', 'ptpt', 2);
  D('combo_corner', 'combo', 'corner', 'p.tt', 3);
  D('combo_hook', 'combo', 'hook', 't.pt', 3);
  D('station_4', 'station', null, 'pppp', 2);
  D('station_3a', 'station', null, '.ppp', 3);
  D('station_3b', 'station', null, 'p.pp', 3);
  D('station_2h', 'station', null, 'p.p.', 3);
  D('station_2v', 'station', null, '.p.p', 3);
  D('sab_hook', 'sabotage', 'hook', null, 4);
  D('sab_corner', 'sabotage', 'corner', null, 4);
  D('sab_straight', 'sabotage', 'straight', null, 2);
  D('sab_wave', 'sabotage', 'wave', null, 1);
  D('sab_tside', 'sabotage', 'tside', null, 1);
  D('penn', 'penn', null, 'xxxx', 1);
  D('hub', 'hub', null, 'pppp', 0);

  var SHAPE_EDGES = { hook: 't..t', corner: '..tt', straight: '.t.t', wave: 't.t.', tside: 'tt.t', tthru: 't.tt', cross: 'tttt' };
  var BONUS = { 2: 3, 3: 8, 4: 15 };
  var HAND = 7;

  function edgeOf(t, rot, d) { return DEFS[t].edges[(d + (rot ? 2 : 0)) & 3]; }
  function hasTrack(t) { var e = DEFS[t].edges; return !!e && (e.indexOf('t') >= 0 || e.indexOf('x') >= 0); }
  function symmetric(t) { var e = DEFS[t].edges; return !e || (e[0] === e[2] && e[1] === e[3]); }

  function rng(seed) { var a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var x = arr[i]; arr[i] = arr[j]; arr[j] = x; } return arr; }

  // ---------- analysis: lines, loose ends, platforms ----------
  function analyze(board) {
    var lines = [], lineOf = new Map();
    board.forEach(function (e, k) {
      if (!hasTrack(e.t) || lineOf.has(k)) return;
      var line = { id: lines.length, cells: [], track: 0, body: 0, platforms: 0, loose: [], caps: [], frozen: false, owner: e.o, locked: !!e.lk, label: e.lb || null, hasPenn: false };
      var stack = [e]; lineOf.set(k, line.id);
      while (stack.length) {
        var c = stack.pop(); line.cells.push(c); line.track++;
        if (c.br) line.frozen = true;
        if (c.t === 'penn') line.hasPenn = true; else line.body++;
        for (var d = 0; d < 4; d++) {
          var a = edgeOf(c.t, c.rot, d);
          if (a !== 't' && a !== 'x') continue;
          var nx = c.x + DX[d], ny = c.y + DY[d], nk = key(nx, ny), n = board.get(nk);
          if (!n) { if (a === 't') line.loose.push({ x: c.x, y: c.y, d: d }); continue; }
          var b = edgeOf(n.t, n.rot, opp(d));
          if (b === 't' || b === 'x') { if (!lineOf.has(nk)) { lineOf.set(nk, line.id); stack.push(n); } }
          else if (b === 'p') { line.platforms++; line.caps.push({ x: nx, y: ny, d: opp(d) }); }
        }
      }
      if (line.hasPenn) line.platforms++;
      lines.push(line);
    });
    return { lines: lines, lineOf: lineOf };
  }
  function lineAt(an, x, y) { var id = an.lineOf.get(key(x, y)); return id === undefined ? null : an.lines[id]; }
  function lineValue(L) { return L.body * Math.max(1, L.platforms); } // Penn is a station, not track

  // ---------- simulate a placement; null if illegal ----------
  function simPlace(S, P, t, rot, x, y) {
    var board = S.board, k = key(x, y);
    if (board.has(k)) return null;
    var def = DEFS[t]; if (!def.edges) return null;
    var A = S.an, hasNb = false, freePlat = false, frozenCap = false, merge = [], caps = [], d, n, a, b, L;
    for (d = 0; d < 4; d++) {
      n = board.get(key(x + DX[d], y + DY[d])); if (!n) continue;
      hasNb = true;
      a = edgeOf(t, rot, d); b = edgeOf(n.t, n.rot, opp(d));
      L = hasTrack(n.t) ? lineAt(A, n.x, n.y) : null;
      if (a === '.') { if (b === '.' || b === 'x') continue; return null; }
      if (a === 't') {
        if (b === 't' || b === 'x') {
          if (L.frozen || L.locked) return null;
          if (S.bridgeSafe && L.owner !== P && (DEFS[n.t].kind === 'bridge')) return null; // can't take a line through a bridge end
          if (merge.indexOf(L.id) < 0) merge.push(L.id); continue;
        }
        if (b === 'p') { freePlat = true; continue; }
        return null;
      }
      if (a === 'p') {
        if (b === 't' || b === 'x') { if (L.locked) return null; if (L.frozen) { frozenCap = true; continue; } caps.push(L.id); continue; } // a station may sit on a frozen line's end; that line stays frozen
        return null;
      }
      if (a === 'x') {
        if (b === 't') { if (L.frozen || L.locked) return null; if (merge.indexOf(L.id) < 0) merge.push(L.id); continue; } // Penn's magic: it may go on any line, takes it, and caps that end
        if (b === 'p') { freePlat = true; continue; }
        if (b === '.') continue;
        return null;
      }
    }
    if (!hasNb) return null;
    if (frozenCap && !caps.length && !merge.length) return null; // not on its own: only as part of a move on a live line
    var track = hasTrack(t), i;
    var ownCap = false;
    for (i = 0; i < caps.length; i++) { L = A.lines[caps[i]]; if (L.owner === P || (track && merge.indexOf(L.id) >= 0)) ownCap = true; }
    if (caps.length && !ownCap && !(track && merge.length)) return null; // stations only come with a move on your own line
    if (track && S.rule === 'link' && t !== 'penn') { // rulebook takeover: the piece must also join a line of yours or a free platform
      var rival = false, own = false;
      for (i = 0; i < merge.length; i++) { if (A.lines[merge[i]].owner === P) own = true; else rival = true; }
      if (rival && !own && !freePlat) return null;
    }
    var nb = new Map(board), taken = [];
    var entry = { t: t, rot: rot ? 1 : 0, x: x, y: y, o: track ? P : -1, br: 0, im: 0, lk: 0, lb: null };
    nb.set(k, entry);
    if (track) {
      for (i = 0; i < merge.length; i++) {
        L = A.lines[merge[i]];
        if (L.owner !== P) { taken.push(L); L.cells.forEach(function (c) { var c2 = Object.assign({}, c); c2.o = P; nb.set(key(c.x, c.y), c2); }); }
      }
    }
    var A2 = analyze(nb), touched = [];
    if (track) touched.push(A2.lineOf.get(k));
    for (d = 0; d < 4; d++) {
      if (edgeOf(t, rot, d) !== 'p') continue;
      var id = A2.lineOf.get(key(x + DX[d], y + DY[d]));
      if (id !== undefined && touched.indexOf(id) < 0) {
        n = nb.get(key(x + DX[d], y + DY[d])); b = edgeOf(n.t, n.rot, opp(d));
        if (b === 't' || b === 'x') touched.push(id);
      }
    }
    var finished = [];
    for (i = 0; i < touched.length; i++) {
      L = A2.lines[touched[i]];
      if (L.frozen) continue;
      if (L.loose.length === 0) {
        if (L.body < 2) { if (L.hasPenn || L.owner !== P) continue; return null; } // a rival's one-piece line capped by your spare station just goes dead // a line needs 2+ body pieces to finish; Penn does not count
        if (!L.frozen) finished.push(L);
      }
    }
    return { kind: 'place', board: nb, an: A2, entry: entry, taken: taken, finished: finished, line: track ? A2.lines[A2.lineOf.get(k)] : null, capped: caps.map(function (c) { return A.lines[c]; }) };
  }

  function canBreak(e, shape) { return e && DEFS[e.t].kind === 'track' && DEFS[e.t].shape === shape && !e.br && !e.lk; } // a repaired piece may be broken again, any number of times
  function simSabotage(S, P, t, x, y) {
    var e = S.board.get(key(x, y));
    if (DEFS[t].kind !== 'sabotage' || !canBreak(e, DEFS[t].shape)) return null;
    var nb = new Map(S.board), e2 = Object.assign({}, e); e2.br = 1; nb.set(key(x, y), e2);
    return { kind: 'sabotage', board: nb, an: analyze(nb), target: e2, line: lineAt(S.an, x, y), taken: [], finished: [] };
  }
  function simRepair(S, P, t, x, y) {
    var e = S.board.get(key(x, y)); if (!e || !e.br) return null;
    var def = DEFS[t];
    if (!(def.kind === 'penn' || ((def.kind === 'track' || def.kind === 'bridge') && def.shape === DEFS[e.t].shape))) return null; // plain track or a bridge of the same shape
    var old = lineAt(S.an, x, y), nb = new Map(S.board);

      if (back.conn && back.conn !== conn) { try { back.conn.close(); } catch (e) { /* already closed */ } }
      back.conn = conn; clearTimeout(back.timer); cfg.seats[back.seat] = 'remote'; net.names[back.seat] = back.name;
      renderScores(); net.cast(null);
      if (S && !S.over && S.turn === back.seat && ui.busy && !net.waiting) { /* a bot was mid-turn for them; it finishes, then they play */ }
      else if (S && !S.over && S.turn === back.seat) waitRemote(back.seat);
      return;
    }
    if (!c) return;
    if (msg.k === 'hello') { c.name = clean(msg.name); c.token = msg.token || null; castLobby(); return; }
    if (net.lobby || !S || S.over) return;
    if (msg.k === 'move' || msg.k === 'skip') { net.pending = { seat: c.seat, msg: msg }; if (net.waiting) takeRemote(); }
  }
  function takeRemote() {
    var pn = net.pending; net.pending = null;
    if (!pn || pn.seat !== S.turn) return;
    var ev;
    try { ev = pn.msg.k === 'move' ? E.applyMove(S, pn.seat, pn.msg.mv) : (pn.msg.what === 'swap' ? E.tradeHand(S, pn.seat) : E.pass(S, pn.seat)); }
    catch (e) { net.cast(null); return; } // not a legal move from where the game stands: send the true state back
    net.waiting = false; note(ev); net.cast(ev); ui.busy = true; playEvent(ev).then(next);
  }
  function waitRemote(p) {
    ui.busy = true; planRefresh();
    var news = sinceLast(viewP); setStatus((news ? news + ' ' : '') + waitLine()); renderScores(); renderAll();
    if (net.mode === 'host') { net.waiting = true; if (net.pending) takeRemote(); }
  }
  function hostLost(conn) {
    var c = connOf(conn); if (!c) return;
    if (net.lobby) { net.conns.splice(net.conns.indexOf(c), 1); castLobby(); return; }
    c.conn = null;
    if (c.seat >= 0 && S && !S.over && cfg.seats[c.seat] === 'remote') { // they stepped away: hold the seat for a while
      net.names[c.seat] = c.name + ' (away)'; net.cast(null); renderScores();
      if (net.waiting && S.turn === c.seat) setStatus('Waiting for ' + tag(c.seat) + ' to come back…');
      clearTimeout(c.timer);
      c.timer = setTimeout(function () { // still gone after 3 minutes: a bot plays for them until they return
        if (c.conn || !S || S.over) return;
        cfg.seats[c.seat] = 'medium'; net.names[c.seat] = c.name + ' (bot until back)'; net.cast(null); renderScores();
        if (net.waiting && S.turn === c.seat) { net.waiting = false; botTurn(c.seat); }
      }, 180000);
    }
  }
  function hostStart() {
    var k = net.conns.length, total = Math.max(2, 1 + k, Math.min(4, $('ntotal') ? +$('ntotal').value : 2)), lvl = $('nbots') ? $('nbots').value : 'medium', names = [net.myName], p;
    cfg.n = total; cfg.seats = [];
    for (p = 0; p < 4; p++) cfg.seats[p] = p === 0 ? 'human' : (p <= k ? 'remote' : lvl);
    net.conns.forEach(function (c, i) { c.seat = i + 1; names[i + 1] = c.name; });
    for (p = 1 + k; p < total; p++) names[p] = 'Bot ' + (p - k);
    net.names = names; net.lobby = false; net.waiting = false; net.pending = null;
    setPalette(randomPalette()); S = E.newGame({ players: total }); started = true; lastBounds = ''; feed = []; sole = 0; viewP = 0; ui.cover = false;
    hideSheet(); fit(true, true); renderScores(); net.cast(null); next();
  }
  function seatToken(code) {
    var k = 'rival-lines-seat-' + code, t = null;
    try { t = localStorage.getItem(k); } catch (e) { t = null; }
    if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem(k, t); } catch (e) { /* private mode */ } }
    return t;
  }
  function joinRoomWith(code, name, ice) {
    net.reset(); net.mode = 'guest'; net.code = code; net.myName = name; net.ice = ice; net.token = seatToken(code); net.lost = false; net.retries = 0;
    newGuestPeer();
  }
  function newGuestPeer() {
    var peer = net.peer = new window.Peer({ config: { iceServers: net.ice } });
    peer.on('open', function () { if (net.peer === peer) guestConnect(); });
    peer.on('disconnected', function () { if (net.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) { /* retried below */ } } });

      var t = err && err.type; net.reset();
      netMsg(t === 'peer-unavailable' ? 'No room called ' + net.code + '. Check the code, and that the host has opened it.' : 'Could not connect (' + (t || 'network') + '). Check your connection and try again.');
    });
  }
  function guestConnect() {
    var peer = net.peer; if (!peer || peer.destroyed || peer.disconnected) return;
    var conn = net.host = peer.connect(roomId(net.code), { reliable: true, serialization: 'json' });
    conn.on('open', function () {
      if (net.host !== conn) return;
      conn.send({ k: 'hello', name: net.myName, token: net.token });
      if (net.lost) { net.lost = false; net.retries = 0; setStatus('Back in the game.'); } else netMsg('Joined room ' + net.code + '. Waiting for the host…');
    });
    conn.on('data', guestHears);
    conn.on('close', function () { if (net.mode === 'guest' && net.host === conn) guestLost(); });
  }
  function guestLost() {
    if (!started || !S || S.over) { var code = net.code; net.reset(); ui.busy = true; showStart(); netMsg('Lost the connection to room ' + code + '.'); return; }
    if (net.lost) return;
    net.lost = true; net.retries = 0; ui.busy = true; setStatus('Connection lost. Reconnecting…'); renderAll(); guestRetry();
  }
  function guestRetry() {
    if (net.mode !== 'guest' || !net.lost) return;
    if (++net.retries > 60) { var code = net.code; net.reset(); ui.busy = true; showStart(); netMsg('Could not get back into room ' + code + '. Join again with the same code and name to take your seat back.'); return; }
    var peer = net.peer;
    if (!peer || peer.destroyed) newGuestPeer();

  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;

    if (net.mode === 'guest') { if (net.lost) guestRetry(); else if (net.host && !net.host.open && started) guestLost(); }
  });
  function guestHears(msg) {
    if (!msg || net.mode !== 'guest') return;
    if (msg.k === 'full') { net.reset(); netMsg('That room is full or its game has already started.'); return; }
    if (msg.k === 'lobby') {
      net.inLobby = true;
      sheet('<h1>Room ' + net.code + '</h1><p class="sub">You are in. Waiting for the host to start the game.</p><h2>In the room: ' + msg.names.length + '</h2><ol>' + msg.names.map(function (n) { return '<li>' + clean(n) + '</li>'; }).join('') + '</ol><div class="sheetbar"><button type="button" class="btn" id="leaveBtn">Leave the room</button></div>');
      return;
    }
    if (msg.k === 'state') { net.q.push(msg); drain(); }
  }
  function drain() { // play the host's updates one at a time, in order
    if (net.playing || !net.q.length || net.mode !== 'guest') return;
    var msg = net.q.shift(), fresh = !S || net.inLobby || !started || (msg.game.moveNo === 0 && !msg.ev);
    net.playing = true; cfg.n = msg.n; cfg.seats = [0, 1, 2, 3].map(function (p) { return p === msg.you ? 'human' : 'remote'; });
    net.seat = msg.you; net.names = (msg.names || []).map(clean); setPalette(msg.pal); sole = msg.you; viewP = msg.you; started = true; ui.cover = false;
    S = E.deserialize(msg.game);
    if (net.inLobby) { hideSheet(); net.inLobby = false; }
    if (fresh) { lastBounds = ''; feed = []; fit(true, true); }
    var done = function () { net.playing = false; if (net.q.length) drain(); else next(); };
    if (msg.ev && !fresh) { note(msg.ev); ui.busy = true; playEvent(msg.ev).then(done); } else { renderScores(); done(); }
  }

  function start(data) {
    svg = $('board'); viewG = $('view'); shadowG = $('shadows'); tilesG = $('tiles'); trainsG = $('trains'); marksG = $('marks'); fxG = $('fx'); wrap = $('boardWrap');
    wire(); requestAnimationFrame(ticker);
    var restored = false;
    try { if (data && data.game && data.game.v === 3 && data.cfg) { S = E.deserialize(data.game); cfg = data.cfg; setPalette(cfg.pal); started = !!data.started; restored = started; } } catch (e) { S = null; }
    if (!S) S = E.newGame({ players: cfg.n });
    setSole(); if (restored && typeof data.viewP === 'number') viewP = data.viewP;
    fit(true, true); renderScores();
    if (restored) { if (S.over) endGame(); else if (isBot(S.turn)) botTurn(S.turn); else { viewP = S.turn; beginTurn(); } }
    else { ui.busy = true; ui.cover = true; setStatus('Press Start to deal the tiles.'); renderAll(); showStart(); }
    snapshot();
  }
  window.__rl = { net: function () { return net; }, showTiles: showTiles, state: function () { return S; }, ui: ui, viewP: function () { return viewP; }, select: selectTile, tap: tapCell, confirm: confirmMove, rotate: rotate, skip: skip };
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
