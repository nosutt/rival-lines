window.RL_VARIANT = "city";
window.RL_BUILD = "20261124-2036";
(function () { // check for a newer build: on load, when the page comes back to the front, and every 2 minutes
  function check(onLoad) {
    try {
      fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
        var m = t.match(/RL_BUILD = "([^"]+)"/); if (!m || m[1] === window.RL_BUILD) return;
        var u = location.pathname + '?v=' + m[1];
        var inGame = !!(window.__rl && window.__rl.state && window.__rl.state() && !window.__rl.state().over && document.getElementById('overlay').className !== 'on');
        if (onLoad && !inGame) { if (location.search.indexOf(m[1]) < 0) location.replace(u); return; }
        if (document.getElementById('upd')) return;
        var d = document.createElement('a'); d.id = 'upd'; d.href = u; d.textContent = 'A new version is ready. Tap to update (this restarts the game).';
        d.style.cssText = 'position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:50;background:#ffd23f;color:#1c1600;font:600 14px system-ui,sans-serif;padding:9px 14px;border-radius:12px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.3);max-width:92vw;text-align:center';
        document.body.appendChild(d);
      }).catch(function () {});
    } catch (e) {}
  }
  check(true);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(false); });
  setInterval(function () { check(false); }, 120000);

<style>
/* layout idea: one game table. Scores on a top rail, the board fills the middle, your rack sits at the bottom. */
:root {
  --table: #0d3840;
  --table-deep: #082a31;
  --rail: #06222a;
  --ink: #101c22;
  --paper: #fcfdf9;
  --text: #eef7f5;
  --muted: #9fbdbb;
  --signal: #ffd23f;
  --you: #2a78f0;
  --bot: #ff6a13;
  --display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--table-deep);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, .tilebtn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; position: relative; overflow: hidden; }
#app > * { min-width: 0; }

/* ---- top rail ---- */
#top { background: var(--rail); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 3px solid #041920; }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.bot { justify-content: flex-end; text-align: right; }
.swatch { width: 14px; height: 34px; border-radius: 7px; flex: none; border: 2px solid rgba(255, 255, 255, .85); }
.you .swatch { background: var(--you); }
.bot .swatch { background: var(--bot); }
.who { min-width: 0; }
.who b { font-family: var(--display); font-weight: 600; font-size: 17px; display: block; line-height: 1.1; }
.who small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.pts { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
.side.turn .pts { color: var(--signal); }
#mid { text-align: left; }
#title { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; line-height: 1.1; }
#bag { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* ---- board ---- */
#boardWrap { position: relative; min-height: 0; background-color: var(--table); background-image: radial-gradient(rgba(255, 255, 255, .07) 1.2px, transparent 1.4px); background-size: 22px 22px; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#board .lbl { font-family: var(--display); font-weight: 700; }
#zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
#zoom button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(6, 34, 42, .88); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1; }
#zoom #zfit { font-size: 13px; }

/* ---- rack ---- */
#tray { background: var(--rail); border-top: 3px solid #041920; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
#status { min-height: 2.7em; font-size: 16px; display: flex; align-items: center; }
#status b { font-family: var(--display); font-weight: 600; }
#status .y { color: #8fb8ff; }
#status .b { color: #ffb184; }
#status .hi { color: var(--signal); }
#hand { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 7px; max-width: 800px; width: 100%; margin: 0 auto; }
.tilebtn { padding: 0; border: 0; background: none; border-radius: 10px; display: block; width: 100%; max-width: 112px; justify-self: center; position: relative; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); }
.tilebtn svg { display: block; width: 100%; height: auto; }
.tilebtn.dead { opacity: .42; }
.tilebtn.sel { filter: drop-shadow(0 0 0 var(--signal)) drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); top: -5px; outline: 3px solid var(--signal); outline-offset: 1px; }
#actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.btn { border: 0; border-radius: 12px; padding: 9px 14px; min-height: 42px; background: #134a54; color: var(--text); font-family: var(--display); font-weight: 600; font-size: 15.5px; }
.btn.primary { background: var(--signal); color: #1c1600; }
.btn:disabled { opacity: .38; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 9px 10px; font-size: 15px; color: var(--muted); min-height: 42px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--signal); }

/* ---- sheets (start, rules, result) ---- */
#overlay { position: absolute; inset: 0; background: rgba(4, 22, 27, .78); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#overlay.on { display: flex; }
.sheet { background: #f7faf6; color: var(--ink); border-radius: 20px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; padding: 22px 22px 20px; box-shadow: 0 10px 0 rgba(0, 0, 0, .3); color-scheme: light; }
.sheet h1 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 0 0 2px; line-height: 1.05; text-wrap: balance; }
.sheet h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 16px 0 6px; }
.sheet p { margin: 6px 0; max-width: 62ch; }
.sheet .sub { color: #486068; margin-bottom: 10px; }
.sheet ol { margin: 6px 0 0; padding-left: 1.3em; }
.sheet li { margin: 5px 0; max-width: 60ch; }
.sheet li b, .sheet p b { font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border-radius: 11px; background: #e8efea; color: var(--ink); }
.opt input { margin-top: 3px; width: 18px; height: 18px; accent-color: #0d3840; flex: none; }
.sheet .btn { background: #0d3840; color: #fff; }
.sheet .btn.primary { background: var(--signal); color: #1c1600; }
.sheetbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin-top: 6px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.legend svg { width: 58px; height: auto; flex: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); }
.tilegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px 12px; }
.tilegrid div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.tilegrid svg { width: 100%; max-width: 104px; height: auto; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); }
table.res { border-collapse: collapse; width: 100%; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.res th, table.res td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #d5ded8; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res tr.tot td { font-family: var(--display); font-weight: 700; font-size: 22px; border-bottom: 0; }
.cy { color: #1d5fc4; } .cb { color: #cf4f06; }

@media (max-width: 520px) {
  #top { padding: 6px 12px; gap: 6px; }
  .pts { font-size: 28px; }
  .who small { display: none; }
  #title { font-size: 16px; }
  #tray { padding: 6px 12px 8px; gap: 6px; }
  #status { font-size: 15px; }
  .btn { padding: 8px 11px; font-size: 14.5px; }
  .toggle { font-size: 14px; padding: 8px 6px; }
  .sheet { padding: 18px 16px 16px; }
  .sheet h1 { font-size: 26px; }
}

/* ---- players ---- */
#chips { display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 6px; border-radius: 12px; background: #0b3038; border: 2px solid transparent; }
.chip.turn { border-color: var(--signal); background: #124650; }
.chip .sw { width: 12px; height: 26px; border-radius: 6px; border: 2px solid rgba(255, 255, 255, .85); flex: none; }
.chip .nm { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.05; display: flex; flex-direction: column; }
.chip .nm small { font-family: var(--body); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.chip .pts { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; }
.chip.turn .pts { color: var(--signal); }
div.tilebtn { cursor: default; }
.opts.row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seats { display: grid; gap: 6px; margin-top: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 11px; background: #e8efea; }
.seat .sw { width: 14px; height: 26px; border-radius: 7px; border: 2px solid #101c22; flex: none; }
.seat label { font-family: var(--display); font-weight: 600; min-width: 4.4em; }
.seat input, .seat select { flex: 1; min-width: 0; min-height: 38px; border-radius: 9px; border: 2px solid #0d3840; background: #fff; color: #101c22; padding: 4px 8px; font: inherit; }
@media (max-width: 520px) {
  #top { grid-template-columns: minmax(0, 1fr); }
  #mid { display: flex; gap: 10px; align-items: baseline; }
  #chips { justify-content: flex-start; }
  .chip { padding: 3px 8px 3px 5px; gap: 5px; }
  .chip .nm small { display: none; }
  .chip .nm { font-size: 14px; }
  .chip .pts { font-size: 20px; }
}

.tilegrid small { font-size: 12px; color: #5a6c72; text-align: center; line-height: 1.2; }
.tilegrid .gone svg { opacity: .3; }

#market { display: flex; gap: 7px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 800px; width: 100%; margin: 0 auto; }
#market .mlabel { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); }
#market .tilebtn { width: 84px; max-width: 84px; }
#market .tilebtn.off { opacity: .55; cursor: default; }
#market .btn { min-height: 38px; }
#market .tilebtn.pick, #market .btn.pick { outline: 4px solid var(--signal); outline-offset: 2px; transform: translateY(-6px); opacity: 1 !important; }

(function (root) {
